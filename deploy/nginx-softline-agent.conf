server {
    listen 80;
    server_name _;

    server_tokens off;
    autoindex off;
    client_max_body_size 2m;

    # Certbot HTTP-01 challenge (ready for future domain/TLS activation)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Never expose internal Mock-Webim endpoints outside loopback
    location ^~ /mock-webim/ {
        return 404;
    }

    # Do not write webhook secret path tokens into nginx access logs
    location ^~ /webhook/webim/ {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Proxy app, UI, and registered /pdfs/ downloads through FastAPI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
